[package]
authors = [ "Adrian Covaci <6562353+acovaci@users.noreply.github.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Tree-sitter grammar for Witze, a language similar to the scripting language used by the Clausewitz game engine"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "witze" ]
license = "MIT"
name = "tree-sitter-witze"
readme = "README.md"
repository = "https://github.com/acovaci/tree-sitter-witze"
version = "0.0.1"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
