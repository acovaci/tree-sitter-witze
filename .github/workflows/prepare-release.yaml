name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.4.0)"
        required: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@v3
        with:
          tag: v${{ inputs.version }}
          version: ${{ inputs.version }}

      - name: Bump version file
        run: echo "${{ inputs.version }}" > version.txt

      - name: Bump version on each package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          jq --arg v "$VERSION" '.metadata.version = $v' package.json > tmp.json && mv tmp.json package.json
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$VERSION\"/" pyproject.toml

      - name: Open release pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          branch: release/${{ inputs.version }}
          title: "Release ${{ inputs.version }}"
          commit-message: "chore: release ${{ inputs.version }}"
          body: "Automated release preparation for ${{ inputs.version }}."
